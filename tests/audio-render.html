<!doctype html><meta charset="utf-8"><title>Teste do motor multipista</title>
<button id="run">Testar soma real das pistas</button><pre id="result">Aguardando</pre>
<script src="../voice-mixer.js"></script><script>
async function renderCase(mode,rate=44100){
 const long=mode==='long',seconds=long?340:.5;
 const offline=new OfflineAudioContext(2,Math.ceil(seconds*rate),rate),starts=[];
 const merger=offline.createChannelMerger(2),mix=offline.createGain();mix.connect(merger,0,0);merger.connect(offline.destination);
 const context={currentTime:0,state:'running',destination:mix,createGain:()=>offline.createGain(),createDynamicsCompressor:()=>offline.createDynamicsCompressor(),createBufferSource:()=>{const source=offline.createBufferSource(),original=source.start.bind(source);source.start=(...args)=>{starts.push(args);original(...args);};return source;},resume:async()=>{},close:async()=>{}};
 const values=mode==='overload'?[.95,.95,.95]:mode==='solo-seven'?[.1,.2,.3,.1,.1,.1,.1]:[.1,.2,.3];
 const buffers=values.map(value=>{const b=offline.createBuffer(1,Math.ceil((seconds+.1)*rate),rate);b.getChannelData(0).fill(value);return b;});
 const mixer=new PibuVoiceMixer(buffers.map((buffer,i)=>({id:String(i),buffer})),{contextFactory:()=>context});
 if(mode==='solo'||mode==='solo-seven')mixer.toggleSolo('1');if(mode==='mute')mixer.toggleMute('0');
 // Independent reference: one already mixed buffer, through the output protector.
 const expected=(mode==='solo'||mode==='solo-seven'?.2:mode==='mute'?.5:values.reduce((a,b)=>a+b,0))*.8*.8;
 const reference=offline.createBufferSource(),referenceBuffer=offline.createBuffer(1,Math.ceil((seconds+.1)*rate),rate);referenceBuffer.getChannelData(0).fill(expected);reference.buffer=referenceBuffer;
 const limiter=offline.createDynamicsCompressor();limiter.threshold.value=-3;limiter.knee.value=0;limiter.ratio.value=20;limiter.attack.value=.003;limiter.release.value=.15;
 reference.connect(limiter);limiter.connect(merger,0,1);reference.start(.06);
 await mixer.play();const result=await offline.startRendering(),data=result.getChannelData(0),baseline=result.getChannelData(1);
 const samples=long?[.2,216,219,220,339]:[.2];
 let actual;for(const second of samples){const index=Math.round(second*rate);actual=data[index];if(Math.abs(actual-baseline[index])>1e-6)throw Error(`${mode} ${second}s: ${actual} != ${baseline[index]}`);}
 if(!starts.every(start=>JSON.stringify(start)===JSON.stringify(starts[0])))throw Error('Inícios diferentes');
 let peak=0;for(const value of data){if(!Number.isFinite(value))throw Error('Amostra inválida');peak=Math.max(peak,Math.abs(value));}
 if(mode==='overload'&&peak>=1)throw Error('Saída saturada: '+peak);
 if(mode==='solo-seven'&&actual<.12)throw Error('Solo continua baixo: '+actual);
 mixer.destroy();return `${mode}: PCM ${actual.toFixed(6)}; pico ${peak.toFixed(4)}; ${values.length} pistas sincronizadas; ${rate} Hz${long?'; 340s incluindo 3:39':''}`;
}
document.getElementById('run').onclick=async()=>{const out=document.getElementById('result');try{const results=[];for(const mode of ['all','solo','solo-seven','mute','overload'])results.push(await renderCase(mode));for(const rate of [44100,48000])results.push(await renderCase('long',rate));out.textContent='PASS\n'+results.join('\n');}catch(error){out.textContent='FAIL '+error.stack;}};
</script>
